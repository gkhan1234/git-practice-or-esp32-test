<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="chipGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
    <linearGradient id="traceGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer rounded chip body -->
  <rect x="10" y="10" width="28" height="28" rx="6" fill="#111827" stroke="url(#chipGrad)" stroke-width="2.5" />

  <!-- Corner circuit traces -->
  <path d="M4 14H10M4 24H10M4 34H10" stroke="url(#traceGrad)" stroke-width="2" stroke-linecap="round" />
  <path d="M38 14H44M38 24H44M38 34H44" stroke="url(#traceGrad)" stroke-width="2" stroke-linecap="round" />
  <path d="M14 4V10M24 4V10M34 4V10" stroke="url(#chipGrad)" stroke-width="2" stroke-linecap="round" />
  <path d="M14 38V44M24 38V44M34 38V44" stroke="url(#chipGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Inner core & Greek 'Mu' / 'Micro' pulse symbol -->
  <rect x="16" y="16" width="16" height="16" rx="3" fill="#1F2937" stroke="#374151" stroke-width="1.5" />
  
  <!-- Stylized 'M' / Micro pulse wave -->
  <path d="M18 29V20L22 25L26 20V29" stroke="#FFB300" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Glowing diode node -->
  <circle cx="30" cy="18" r="2.2" fill="#00F0FF" filter="url(#glow)" />
</svg>
